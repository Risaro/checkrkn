name: update-lists

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build lists
        run: python3 build/build.py > /tmp/stats.log
      - name: Commit if changed
        run: |
          git config user.name "Risaro"
          git config user.email "62798663+Risaro@users.noreply.github.com"
          git add lists cache
          if git diff --cached --quiet -- lists/blocklist.txt lists/blocklist-safe.txt; then
            git reset -q
            echo "no list changes"
            exit 0
          fi
          git commit -q -m "lists: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
